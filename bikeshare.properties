# Parametros de tarifacao e limites do Bikeshare (BS04).
# Pode ser editado sem recompilar. Valores monetarios usam ponto decimal.
# Se uma chave for removida, vale o padrao do enunciado (os valores abaixo).

# Plano avulso: valor de cada minuto da corrida
avulso.valorMinuto=0.50

# Plano assinante: minutos gratuitos por corrida, preco do minuto excedente e mensalidade padrao
assinante.franquiaMinutos=60
assinante.valorMinutoExcedente=0.30
assinante.mensalidadePadrao=30.00

# Bicicleta eletrica: adicional por minuto e bateria minima (%) para poder ser retirada
eletrica.adicionalPorMinuto=0.20
eletrica.bateriaMinimaPercentual=15

# Aluguel: carencia (devolver na mesma estacao ate N minutos cancela, sem cobranca)
# e tempo maximo de uso (acima disso o aluguel expira)
aluguel.carenciaMinutos=2
aluguel.tempoMaximoMinutos=1440

# Penalidade aplicada automaticamente quando o aluguel expira
penalidade.atraso.valor=10.00

# Saldo minimo no cartao pre-carregado para poder iniciar uma corrida
pagamento.saldoMinimoParaRetirada=0.01
